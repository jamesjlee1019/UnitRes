# Alembic = database migrations. Each file in alembic/versions/ is one change
# to the schema, applied in order. The api container runs any new ones on start.
# How to add one: "Changing the schema" in the README.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# The database URL comes from app/config.py (see alembic/env.py), not from here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
